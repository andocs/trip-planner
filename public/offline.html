<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Offline · Trip Planner</title>
    <style>
      :root { color-scheme: light dark; --bg: #eef3f0; --card: #ffffff; --fg: #1f2a44; --muted: #526071; --btn: #1f2a44; --btn-fg: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #11161f; --card: #1a2230; --fg: #eef3f0; --muted: #a4b0c0; --btn: #eef3f0; --btn-fg: #11161f; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 26rem; padding: 1.75rem; border-radius: 1.5rem; background: var(--card); }
      h1 { margin: 0 0 .5rem; font-size: 1.75rem; line-height: 1.15; }
      p { margin: 0 0 1.25rem; line-height: 1.5; color: var(--muted); }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; padding: 0 1.25rem; border-radius: 999px; background: var(--btn); color: var(--btn-fg); font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You&rsquo;re offline</h1>
      <p>This screen hasn&rsquo;t been saved on this device yet. Open it once while you&rsquo;re online and it will be here next time, even without signal.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
